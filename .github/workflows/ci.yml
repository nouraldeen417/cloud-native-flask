name: Build Docker Image Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  FLASKAPP_IMAGE_NAME: flask-app

jobs:
  build-flask-app-package:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    permissions:
      id-token: write   # required for Azure OIDC
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          IMAGE_TAG="${TODAY}-${GITHUB_RUN_ID}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name $(echo ${{ vars.ACR_LOGIN_SERVER }} | cut -d'.' -f1)

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: src/flaskapp
          push: false
          load: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.FLASKAPP_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.FLASKAPP_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v5
        with:
          context: src/flaskapp
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.FLASKAPP_IMAGE_NAME }}:${{ steps.image-tag.outputs.image_tag }}

  update-k8s-manifests:
    needs: [build-flask-app-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Kubernetes Manifests
        env:
          IMAGE_TAG: ${{ needs.build-flask-app-package.outputs.image_tag }}
        run: |
          sed -i "s|image: .*/${{ env.FLASKAPP_IMAGE_NAME }}:.*|image: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.FLASKAPP_IMAGE_NAME }}:${IMAGE_TAG}|g" kubernetes/flask-deployment.yml

      - name: Commit and Push Changes
        env:
          IMAGE_TAG: ${{ needs.build-flask-app-package.outputs.image_tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/
          git commit -m "Deploy: Update image tags to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"
          git push