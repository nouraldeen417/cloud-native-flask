name: Terraform Infra Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/azure/**' 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform/azure  
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -detailed-exitcode || echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/azure/tfplan
          retention-days: 1

  apply:
    needs: [plan]
    if: needs.plan.outputs.plan_exitcode == '2'   # 2 = changes present
    runs-on: ubuntu-latest
    environment: production   # <-- manual approval gate lives here
    permissions:
      contents: read
      id-token: write
      actions: write   # <-- required for gh variable set
    defaults:
      run:
        working-directory: terraform/azure  
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/azure/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
      - name: Sync ACR login server to repo variable
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT  }}
        run: |
          ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)
          gh variable set ACR_LOGIN_SERVER --repo ${{ github.repository }} --body "$ACR_LOGIN_SERVER"

      - name: Sync DB host and update Kustomize overlay
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          MYSQL_HOST=$(terraform output -raw mysql_fqdn)

          # Sync to a repo variable for visibility/reference elsewhere
          gh variable set MYSQL_HOST_AZURE --repo ${{ github.repository }} --body "$MYSQL_HOST"

          # Update the actual manifest Argo CD reads from
          cd ../../kubernetes/overlays/azure
          sed -i "s|value: .*mysql.database.azure.com|value: ${MYSQL_HOST}|" kustomization.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Sync Azure DB host to ${MYSQL_HOST} [skip ci]" || echo "No changes to commit"
          git push