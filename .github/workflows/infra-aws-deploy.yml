name: Terraform Infra Pipeline (AWS)

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/aws/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -detailed-exitcode || echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws
          path: terraform/aws/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: [plan]
    if: needs.plan.outputs.plan_exitcode == '2'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform Init
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-aws
          path: terraform/aws

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Sync ECR repository URL to repo variable
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          gh variable set ECR_REPOSITORY_URL --repo ${{ github.repository }} --body "$ECR_URL"
      
      - name: Sync DB host and update Kustomize overlay
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          RDS_HOST=$(terraform output -raw rds_endpoint)

          gh variable set MYSQL_HOST_AWS --repo ${{ github.repository }} --body "$RDS_HOST"

          cd ../../kubernetes/overlays/aws
          sed -i "s|value: .*rds.amazonaws.com|value: ${RDS_HOST}|" kustomization.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Sync AWS DB host to ${RDS_HOST} [skip ci]" || echo "No changes to commit"
          git push