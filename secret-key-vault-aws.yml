apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-password-spc
  namespace: default
spec:
  provider: aws
  secretObjects:
    - secretName: mysql-secret
      type: Opaque
      data:
        - objectName: mysql-admin-password
          key: MYSQL_DATABASE_PASSWORD
  parameters:
    objects: |
      - objectName: "<value from secrets_manager_secret_arn>" # Name or full ARN of the secret in AWS Secrets Manager
        objectType: "secretsmanager"